name: Sveglia Supabase
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  sveglia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chiama il database
        run: |
          URL=$(grep -oP 'url:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'chiave:\s*"\K[^"]+' config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/sveglia" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
